name: Keep Supabase Alive

on:
  schedule:
    # Her Pazartesi 09:00 UTC - Supabase'in 7 gunluk inaktivite limitinin altinda kalmak icin
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sf -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/gift_records?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null
